<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#070b08" />
    <title>Memoix — Cherish Every Moment</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #070b08;
        color: #f3f7f3;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 280px;
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(ellipse at 50% 42%, rgb(21 91 45 / 22%), transparent 34rem),
          radial-gradient(ellipse at 50% 110%, rgb(13 55 31 / 18%), transparent 38rem),
          #070b08;
      }

      .logo {
        width: min(100%, 560px);
        padding: clamp(28px, 8vw, 64px) 24px;
        display: grid;
        justify-items: center;
        text-align: center;
      }

      .mark-frame {
        width: clamp(196px, 58vw, 300px);
        aspect-ratio: 1;
        padding: 8%;
        display: grid;
        place-items: center;
        border: 1px solid rgb(139 224 164 / 16%);
        border-radius: 30%;
        background:
          radial-gradient(circle at 50% 42%, rgb(31 125 64 / 20%), transparent 65%),
          linear-gradient(145deg, #101a12, #0a100c 72%);
        box-shadow:
          0 0 0 8px rgb(65 190 103 / 3%),
          0 24px 80px rgb(0 0 0 / 44%),
          0 0 72px rgb(36 170 82 / 12%),
          inset 0 1px 0 rgb(255 255 255 / 5%);
      }

      .mark {
        display: block;
        width: 100%;
        height: 100%;
        overflow: visible;
        filter: drop-shadow(0 3px 12px rgb(56 196 104 / 20%));
      }

      .ring {
        fill: url(#ringGradient);
      }

      .diagonal,
      .wing {
        fill: url(#markGradient);
      }

      .core {
        fill: #b6f3c7;
        filter: drop-shadow(0 0 7px rgb(105 238 143 / 65%));
      }

      .wordmark {
        margin-top: 30px;
        font-size: clamp(42px, 11vw, 58px);
        font-weight: 720;
        letter-spacing: -0.075em;
        line-height: 1;
      }

      .wordmark span {
        color: #73e394;
      }

      .tagline {
        margin: 15px 0 0;
        color: #9aa99d;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.24em;
        line-height: 1.6;
        text-transform: uppercase;
      }

      .accent-line {
        width: 34px;
        height: 2px;
        margin-top: 25px;
        border-radius: 99px;
        background: linear-gradient(90deg, #22c55e, #a5f3b8);
        box-shadow: 0 0 16px rgb(71 219 112 / 45%);
      }

      @media (max-width: 360px) {
        .logo {
          padding-inline: 16px;
        }

        .tagline {
          font-size: 9px;
          letter-spacing: 0.2em;
        }
      }
    </style>
  </head>
  <body>
    <main class="logo" aria-label="Memoix logo">
      <div class="mark-frame">
        <svg
          class="mark"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="-10 -10 154.24 154.24"
          role="img"
          aria-labelledby="markTitle"
        >
          <title id="markTitle">Memoix memory mark</title>
          <defs>
            <linearGradient id="ringGradient" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#a5f3b8" />
              <stop offset=".48" stop-color="#42d878" />
              <stop offset="1" stop-color="#159447" />
            </linearGradient>
            <linearGradient id="markGradient" x1=".15" y1=".1" x2=".85" y2=".9">
              <stop offset="0" stop-color="#f0f8f1" />
              <stop offset="1" stop-color="#b9d8c0" />
            </linearGradient>
          </defs>
          <path
            d="M102.82,10.27l-7.29,7.29c-8.37-4.81-18.07-7.56-28.41-7.56s-20.11,2.77-28.5,7.61l-7.29-7.28C41.69,3.78,53.96,0,67.12,0s25.36,3.76,35.7,10.27Z"
            class="ring"
          />
          <path
            d="M134.24,67.12c0,13.13-3.76,25.37-10.28,35.71l-7.28-7.28c4.81-8.37,7.56-18.08,7.56-28.43s-2.73-19.99-7.51-28.34l7.28-7.28c6.49,10.32,10.23,22.53,10.23,35.62Z"
            class="ring"
          />
          <path
            d="M17.56,95.53l-7.29,7.29C3.76,92.48,0,80.24,0,67.12s3.72-25.22,10.16-35.52l7.3,7.28c-4.75,8.33-7.46,17.97-7.46,28.24s2.75,20.04,7.56,28.41Z"
            class="ring"
          />
          <path
            d="M102.73,124.02c-10.32,6.48-22.53,10.22-35.61,10.22s-25.3-3.74-35.62-10.23l7.28-7.28c8.35,4.78,18.03,7.51,28.34,7.51s19.96-2.73,28.31-7.5l7.3,7.28Z"
            class="ring"
          />
          <path
            d="M62.14,50.97l-11.31,11.31L14.31,25.69c3.3-4.2,7.1-8.01,11.3-11.32l36.53,36.6Z"
            class="diagonal"
          />
          <path
            d="M119.79,108.72c-3.31,4.19-7.12,7.98-11.33,11.28l-36.58-36.63,11.31-11.31,36.6,36.66Z"
            class="diagonal"
          />
          <path
            d="M62.24,83.37l-36.55,36.55c-4.21-3.3-8.01-7.1-11.33-11.3l36.57-36.56,11.27,11.27.04.04Z"
            class="diagonal"
          />
          <path
            d="M119.92,25.69l-36.61,36.61-11.31-11.31L108.62,14.36c4.2,3.32,8,7.12,11.3,11.33Z"
            class="diagonal"
          />
          <rect
            x="59.02"
            y="59.08"
            width="16.07"
            height="16.07"
            transform="translate(-27.82 67.08) rotate(-45)"
            class="core"
          />
          <polygon points="33.85 54.86 33.85 79.59 21.63 91.81 21.63 42.64" class="wing" />
          <polygon points="100.27 54.86 100.27 79.59 112.49 91.81 112.49 42.64" class="wing" />
        </svg>
      </div>
      <div class="wordmark">memo<span>ix</span></div>
      <p class="tagline">Cherish Every Moment</p>
      <div class="accent-line" aria-hidden="true"></div>
    </main>
  </body>
</html>
