name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - mobile-app
    paths:
      - mobile/**
      - .github/workflows/build-android-apk.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install JS dependencies
        working-directory: mobile
        run: npm ci

      - name: Generate native Android project
        working-directory: mobile
        env:
          CI: "1"
        run: npx expo prebuild --platform android --no-install --clean

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: false

      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon --build-cache -PreactNativeArchitectures=arm64-v8a

      - name: Rename APK
        working-directory: mobile
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          mv android/app/build/outputs/apk/release/app-release.apk "memoix-v${VERSION}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: memoix-android-apk
          path: mobile/memoix-v*.apk
          if-no-files-found: error
          retention-days: 30
