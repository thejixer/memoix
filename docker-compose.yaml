services:
  db:
    image: postgres:14.1-alpine
    restart: always
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    user: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 5s
      timeout: 5s

  redis:
    image: redis:latest
    restart: always  # Ensure Redis restarts on failure
    ports:
      - "${REDIS_PORT}:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 3
      timeout: 3s

  pgadmin:
    image: dpage/pgadmin4
    restart: always
    env_file:
      - .env
    ports:
      - "${PGADMIN_PORT}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/misc/ping"]
      interval: 30s
      retries: 3
      timeout: 5s
  backend:
    build:
      context: ./server
      dockerfile: ./Dockerfile
    depends_on:
      - db
      - redis
    ports:
      - "4848:4848"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4848"] # Basic health check
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    volumes:
      - backend_files:/memoixserver/public # adding volume for files
  client:
    build:
      context: ./client # Path to your client's directory
      dockerfile: Dockerfile # Path to the Dockerfile
    ports:
      - "80:80" # Map port 3000 on your host to port 80 in the container
    depends_on:
      backend:
        condition: service_healthy # Wait for the backend to be healthy

volumes:
  db_data:
    name: memoix_db_data  # Persistent PostgreSQL storage
  redis_data:
    name: memoix_redis_data  # Persistent Redis storage
  pgadmin_data:
    name: memoix_pgadmin_data  # Persistent pgAdmin storage
  backend_files: # defining the backend_files volume
    name: memoix_backend_files